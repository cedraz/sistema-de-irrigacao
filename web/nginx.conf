server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker, reconsultado a cada 10s.
    # Sem isto o nginx guarda o IP da API pra sempre: quando você atualiza a
    # API e o container volta com outro IP, o site começa a dar 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket do ESP32.
    location /ws/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # O padrão é 60s. A conexão do ESP32 fica aberta o dia inteiro.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # no-store: o navegador nunca guarda o site, nem no cache de voltar/avançar.
    # "no-cache" não bastou — o navegador restaurou a página da memória com o
    # app.js antigo depois de uma atualização. São 3 arquivos de poucos KB;
    # baixar sempre não custa nada.
    location / {
        add_header Cache-Control "no-store";
    }
}
